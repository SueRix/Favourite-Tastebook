services:
  db:
    image: postgres:15-alpine
    container_name: tastebook_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    env_file:
      - .env
    ports:
      - "5433:5432"

  redis:
    image: redis:alpine
    container_name: tastebook_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: tastebook_web
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Dev: live source mount, so code changes apply without rebuilding the
      # image. runserver reloads on its own; drop this line for a prod-style run.
      - .:/app
      - ./media:/app/media
      - ./static:/app/static
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: tastebook_celery
    command: celery -A favourite_tastebook worker -l INFO
    volumes:
      # Dev: same live mount as web. Celery has no autoreload, so restart it
      # after changing task code: docker compose restart celery
      - .:/app
      - ./media:/app/media
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_HOST=db
      - DB_PORT=5432
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - web

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: tastebook_n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Warsaw
      - TZ=Europe/Warsaw
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
  n8n_data: